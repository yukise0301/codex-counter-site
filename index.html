<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ボタンを押して数字を増やせる、シンプルなクリックカウンターです。">
  <title>クリックカウンター</title>

  <!-- CSS：色、文字の大きさ、配置など、画面の見た目を決めます。 -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-right: max(24px, env(safe-area-inset-right));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      padding-left: max(24px, env(safe-area-inset-left));
      background: #ffffff;
      color: #202735;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .description {
      margin: 0;
      color: #606976;
      font-size: 15px;
    }

    .counter {
      margin: 32px 0 24px;
      padding: 28px 20px 32px;
      background: #f8f9fb;
      border: 1px solid #e8ebf0;
      border-radius: 24px;
    }

    .counter-label {
      margin: 0 0 8px;
      color: #606976;
      font-size: 14px;
    }

    #count {
      display: block;
      font-size: clamp(72px, 20vw, 104px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      min-height: 56px;
      padding: 14px 20px;
      border: 1px solid transparent;
      border-radius: 14px;
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }

    #increment {
      background: #255be3;
      color: #ffffff;
    }

    #decrement,
    #reset {
      background: #ffffff;
      color: #475160;
      border-color: #dce1e8;
    }

    #decrement:disabled {
      background: #f8f9fb;
      color: #7b8390;
      border-color: #e8ebf0;
      cursor: not-allowed;
    }

    @media (hover: hover) {
      #increment:hover {
        background: #1c49bd;
      }

      #decrement:hover:not(:disabled),
      #reset:hover {
        background: #f8f9fb;
      }
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:focus-visible {
      outline: 3px solid #255be3;
      outline-offset: 4px;
    }

    .hint {
      margin: 20px 0 0;
      color: #606976;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <!-- HTML：画面に表示する文字やボタンを用意します。 -->
  <main aria-labelledby="title">
    <h1 id="title">クリックカウンター</h1>
    <p class="description">ボタンを押して、数えてみましょう。</p>

    <div class="counter">
      <p id="count-label" class="counter-label">現在のカウント</p>
      <output id="count" aria-labelledby="count-label" aria-live="polite" aria-atomic="true">0</output>
    </div>

    <div class="buttons">
      <button id="increment" type="button">＋1増やす</button>
      <button id="decrement" type="button" disabled>−1減らす</button>
      <button id="reset" type="button">リセット</button>
    </div>

    <p class="hint">リセットすると、0からやり直せます。</p>
    <noscript><p>このカウンターを使うには、ブラウザーのJavaScriptを有効にしてください。</p></noscript>
  </main>

  <!-- JavaScript：ボタンを押したときの動きを決めます。 -->
  <script>
    // このブラウザーに保存した数字を、ページを開いたときに復元します。
    const STORAGE_KEY = 'click-counter-count';
    const hint = document.querySelector('.hint');
    const defaultHint = hint.textContent;
    let count = 0;

    try {
      const savedCount = Number(localStorage.getItem(STORAGE_KEY));
      if (Number.isSafeInteger(savedCount) && savedCount >= 0) {
        count = savedCount;
      }
    } catch {
      hint.textContent = '保存した数字を読み込めませんでした。0から始めます。';
    }

    const countDisplay = document.getElementById('count');
    const incrementButton = document.getElementById('increment');
    const decrementButton = document.getElementById('decrement');
    const resetButton = document.getElementById('reset');

    // 数字を表示し、0のときは「−1減らす」を押せないようにします。
    function updateDisplay() {
      countDisplay.textContent = count;
      decrementButton.disabled = count === 0;
    }

    // 操作のたびに数字を保存します。リセットした0も保存します。
    function saveCount() {
      try {
        localStorage.setItem(STORAGE_KEY, String(count));
        hint.textContent = defaultHint;
      } catch {
        hint.textContent = '数字を保存できません。画面を閉じると今回の変更が失われます。';
      }
    }

    // 「＋1増やす」を押すと、数字を1増やして画面を更新します。
    incrementButton.addEventListener('click', () => {
      if (count < Number.MAX_SAFE_INTEGER) {
        count += 1;
      }
      updateDisplay();
      saveCount();
    });

    // 「−1減らす」を押すと1減らします。0未満にはしません。
    decrementButton.addEventListener('click', () => {
      if (count > 0) {
        count -= 1;
      }
      updateDisplay();
      saveCount();
    });

    // 「リセット」を押すと、数字を0に戻して画面を更新します。
    resetButton.addEventListener('click', () => {
      count = 0;
      updateDisplay();
      saveCount();
    });

    // 最初の表示と、減らすボタンの状態をそろえます。
    updateDisplay();
  </script>
</body>
</html>
